<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartPark | Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page auth-white">
  <div class="auth-page">
    <header class="auth-header">
      <div class="container auth-nav">
        <a href="index.html" class="brand">SmartPark</a>
        <nav class="auth-links">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="container auth-grid">
      <section class="auth-panel">
        <div class="auth-card">
          <span class="eyebrow">Smart Parking Login</span>
          <h1>Welcome Back!</h1>
          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required />
              <p class="field-error" id="loginEmailError"></p>
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <div class="password-input-group">
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required />
                <button type="button" class="password-toggle" data-target="loginPassword">Show</button>
              </div>
              <p class="field-error" id="loginPasswordError"></p>
            </div>
            <div class="form-row">
              <label class="checkbox-label"><input type="checkbox" id="rememberMe" /> Remember Me</label>
              <a href="#" class="text-link">Forgot Password?</a>
            </div>
            <button class="button button-primary form-submit">Login</button>
            <button type="button" class="button button-secondary google-button">Continue with Google</button>
          </form>
          <p class="form-note">Don't have an account? <a href="register.html">Register</a></p>
        </div>
      </section>
      <section class="auth-illustration">
        <img src="images/parking-illustration.png" alt="Parking illustration" />
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
